name: Relatar um problema
description: Algo não funciona como deveria
labels: ["problema"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por ajudar! Se for uma falha de segurança, **não use este formulário**: siga o SECURITY.md.
  - type: textarea
    id: oque
    attributes:
      label: O que aconteceu?
      description: Descreva o problema.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que você esperava?
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como repetir
      placeholder: |
        1. Abra o NitRAM
        2. Crie um disco de 2 GB
        3. ...
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Versão do Windows
      placeholder: Windows 11 23H2
  - type: input
    id: versao
    attributes:
      label: Versão do NitRAM
      placeholder: 0.1.0
